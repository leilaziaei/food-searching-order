<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Foodro food delivery logo</title>
  <desc id="desc">Pink food cloche with chef hat and the Foodro wordmark.</desc>

  <!-- Speed lines -->
  <g fill="#FF3B86">
    <rect x="70" y="185" width="82" height="14" rx="7"/>
    <rect x="42" y="218" width="115" height="14" rx="7"/>
    <rect x="65" y="251" width="62" height="14" rx="7"/>
  </g>

  <!-- Cloche -->
  <g fill="#F71870">
    <path d="M190 285c0-72 58-130 130-130s130 58 130 130H190z"/>
    <path d="M170 296h300l-22 25H192l-22-25z"/>
    <path d="M270 142h100v-19c0-8-6-14-14-14h-72c-8 0-14 6-14 14v19z"/>
    <path d="M253 113c-20-3-34-18-34-36 0-20 16-36 36-36 9 0 17 3 23 9 9-21 29-34 53-34 25 0 46 15 54 37 7-7 17-11 27-11 21 0 38 17 38 38 0 18-13 34-31 37v20H253v-24z"/>
  </g>

  <!-- Highlight -->
  <path d="M344 177c29 8 51 31 59 60" fill="none" stroke="#FFD7E7" stroke-width="12" stroke-linecap="round"/>

  <!-- Wordmark -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="142" letter-spacing="-7">
    <text x="500" y="282" fill="#201A2E">Food</text>
    <text x="833" y="282" fill="#F71870">r</text>
  </g>

  <!-- Final O with fork -->
  <circle cx="1010" cy="232" r="63" fill="#F71870"/>
  <circle cx="1010" cy="232" r="25" fill="#FFFDF9"/>
  <g fill="#FFFDF9" transform="rotate(-45 1010 232)">
    <rect x="1005" y="186" width="10" height="65" rx="5"/>
    <rect x="986" y="183" width="7" height="25" rx="3"/>
    <rect x="997" y="180" width="7" height="28" rx="3"/>
    <rect x="1008" y="180" width="7" height="28" rx="3"/>
  </g>
</svg>